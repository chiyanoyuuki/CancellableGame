name: Qualité (typecheck + tests)

# Garde-fou léger et rapide : vérifie le typage TypeScript et lance toute la
# suite Jest (dont le lint qualité de la banque de questions) à chaque push et
# pull request. Séparé du workflow de build APK pour rester rapide.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Vérification du typage
        run: npm run typecheck

      - name: Tests (Jest)
        run: npm test -- --ci
